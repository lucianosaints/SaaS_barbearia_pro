version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbeiro_pro_backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Para espelhar as mudanças locais durante o desenvolvimento
      - django_media:/app/media # Persiste arquivos de mídia (fotos, uploads)
      # Se for usar SQLite, manter isso mapeado preservará os dados no disco host
    env_file:
      - ./backend/.env
    # Se mudar para postgres futuramente, habilitar o depends_on:
    # depends_on:
    #   - db
    networks:
      - barbeiro_pro_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barbeiro_pro_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - barbeiro_pro_net

  waha:
    image: devlikeapro/waha
    container_name: barbeiro_pro_waha
    restart: unless-stopped
    ports:
      - "3001:3000" # Expondo externamente na 3001 para não conflitar, internamente é 3000
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_API_KEY=BarbeariaPro!2026
      - WHATSAPP_API_KEY=BarbeariaPro!2026
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=BarbeariaPro!2026
    networks:
      - barbeiro_pro_net
    volumes:
      - waha_data:/app/.waha

volumes:
  waha_data:
  django_media:
  # db_data: (Se habilitar postgres futuramente)

networks:
  barbeiro_pro_net:
    driver: bridge
