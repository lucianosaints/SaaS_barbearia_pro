server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 15M;

    # Defesa em profundidade para o navegador. As origens externas abaixo sao
    # apenas as usadas atualmente por fontes, avatares e links do produto.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:" always;

    # Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend (Django API)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Desativa o cache do Nginx para a API
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy para Admin
    location /painel-master/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Servir arquivos de mídia: tenta servir direto do volume; se falhar, faz fallback para o Django
    location /arquivos/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend_media;
    }

    location @backend_media {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Proxy para static files do Django (Admin css, etc)
    location /estaticos/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
