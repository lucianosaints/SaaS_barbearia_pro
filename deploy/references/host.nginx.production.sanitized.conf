# Referencia sanitizada da configuracao observada no Nginx do host em 24/09/2026.
# Certificados, includes do Certbot e parametros criptograficos foram omitidos.
# Este arquivo documenta o estado observado; nao deve ser aplicado automaticamente.

server {
    listen 443 ssl;
    server_name salaopro.site www.salaopro.site;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas legadas observadas no host. A configuracao interna do frontend
    # atualmente encaminha /painel-master/, /estaticos/ e /arquivos/.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 80;
    server_name salaopro.site www.salaopro.site;

    # O Certbot mantem regras equivalentes de redirecionamento por host.
    return 301 https://$host$request_uri;
}
